<!-- VIEW 4: PLAYGROUND & MULTIMODAL STUDIO -->
<div id="view-playground" class="space-y-5 sm:space-y-6 hidden w-full min-w-0">
  <div class="p-4 sm:p-6 rounded-xl sm:rounded-2xl glass-panel shadow-sm space-y-3.5 sm:space-y-4 border border-surface-700/60 w-full min-w-0">
    
    <!-- Playground Header Controls -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-surface-700/60 w-full min-w-0">
      <div class="min-w-0">
        <h3 class="text-xs sm:text-sm font-bold text-white flex items-center gap-2">
          <i data-lucide="terminal" class="w-4 h-4 text-brand-400 shrink-0"></i>
          <span data-i18n="playground.title">Multi-Modal Playground Studio</span>
        </h3>
        <p data-i18n="playground.subtitle" class="text-[11px] sm:text-xs text-gray-400 mt-0.5 leading-relaxed">Uji analisis visi, transkripsi audio, system prompt, dan streaming respon model.</p>
      </div>

      <div class="flex items-center flex-wrap gap-2 w-full sm:w-auto">
        <div class="flex items-center gap-1.5 grow sm:grow-0">
          <label class="text-[10px] sm:text-[11px] text-gray-400 font-semibold shrink-0">Key:</label>
          <select id="pgVirtualKey" class="w-full sm:w-auto glass-input px-2.5 py-1.5 rounded-xl text-xs text-white font-mono"></select>
        </div>
        <div class="flex items-center gap-1.5 grow sm:grow-0">
          <label class="text-[10px] sm:text-[11px] text-gray-400 font-semibold shrink-0">Model:</label>
          <select id="pgModel" class="w-full sm:w-auto glass-input px-2.5 py-1.5 rounded-xl text-xs text-white font-mono">
            <optgroup label="⚡ Smart Routing Intents">
              <option value="fastest">⚡ fastest (Groq / Sub-detik)</option>
              <option value="cheapest">💰 cheapest (DeepSeek / Gemini Cost-Saver)</option>
              <option value="smartest">🧠 smartest (GPT-4o / Claude 3.5)</option>
              <option value="auto">🔄 auto (AI Hub Dynamic Failover)</option>
            </optgroup>
            <optgroup label="🌐 Multi-Provider Cloud Models">
              <option value="gemini-3-flash-preview" selected>gemini-3-flash (Google)</option>
              <option value="gemini-2.5-pro">gemini-2.5-pro (Google)</option>
              <option value="gpt-4o-mini">gpt-4o-mini (OpenAI)</option>
              <option value="gpt-4o">gpt-4o (OpenAI Flagship)</option>
              <option value="claude-3-5-sonnet-20241022">claude-3-5-sonnet (Anthropic)</option>
              <option value="openrouter/auto">openrouter/auto (Universal)</option>
              <option value="anthropic/claude-3.7-sonnet">claude-3.7-sonnet (OpenRouter)</option>
              <option value="deepseek/deepseek-r1">deepseek-r1 (OpenRouter)</option>
              <option value="mistral-large-latest">mistral-large-latest (Mistral AI)</option>
              <option value="grok-2-latest">grok-2-latest (xAI)</option>
              <option value="sonar">sonar (Perplexity Search)</option>
              <option value="command-r-plus-08-2024">command-r-plus (Cohere)</option>
              <option value="llama-3.3-70b-versatile">llama-3.3-70b (Groq Cloud)</option>
              <option value="deepseek-chat">deepseek-chat (DeepSeek)</option>
              <option value="llama3.1">llama3.1 (Ollama Local)</option>
            </optgroup>
          </select>
        </div>
      </div>
    </div>

    <!-- System Prompt & Presets -->
    <div class="space-y-3 w-full min-w-0">
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label class="text-[10px] sm:text-[11px] font-bold text-gray-400 uppercase">System Instructions (Optional)</label>
          <div class="flex items-center gap-1.5">
            <span data-i18n="playground.preset_label" class="text-[10px] sm:text-[11px] text-gray-400">Preset:</span>
            <select id="pgPresetSelect" onchange="applyPresetToPlayground(this.value)" class="glass-input px-2 py-0.5 rounded-lg text-xs text-white"></select>
          </div>
        </div>
        <textarea id="pgSystem" rows="2" oninput="updatePlaygroundCostEstimate()" placeholder="e.g. You are a senior principal engineer..." class="w-full glass-input p-2.5 sm:p-3 rounded-xl text-xs text-white font-mono resize-y"></textarea>
      </div>

      <!-- Prompt Box & Attachment Preview -->
      <div>
        <label class="block text-[10px] sm:text-[11px] font-bold text-gray-400 uppercase mb-1.5">User Prompt</label>
        <div id="pgImagePreviewContainer" class="hidden items-center gap-3 p-2.5 mb-2 bg-surface-900/80 rounded-xl border border-surface-700/80">
          <img id="pgImagePreview" src="" alt="Attached image preview" class="w-12 h-12 object-cover rounded-lg border border-surface-700" />
          <div class="flex-1 text-xs text-gray-300 truncate">Image attached to prompt payload</div>
          <button onclick="removePlaygroundImage()" class="text-xs text-red-400 hover:text-red-300 p-1 rounded">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        </div>

        <textarea id="pgPrompt" rows="3" oninput="updatePlaygroundCostEstimate()" placeholder="Type your query or prompt here..." class="w-full glass-input p-2.5 sm:p-3 rounded-xl text-xs text-white font-mono resize-y"></textarea>
      </div>

      <!-- Live Token & Cost Simulator Collapsible -->
      <div class="p-3 sm:p-3.5 rounded-xl bg-surface-900/60 border border-surface-700/60 space-y-2 w-full min-w-0">
        <div class="flex items-center justify-between text-xs">
          <span class="font-bold text-gray-300 flex items-center gap-1.5">
            <i data-lucide="calculator" class="w-3.5 h-3.5 text-amber-400"></i>
            <span>Multi-Provider Cost Simulator</span>
          </span>
          <span id="pgEstTokenCount" class="font-mono font-bold text-amber-300">0 tokens</span>
        </div>
        <div id="pgCostEstimatorGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2 w-full">
          <!-- Rendered dynamically by playground.js -->
        </div>
      </div>

      <!-- Action Bar: Media Attachments & Submit -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pt-1 w-full">
        <div class="flex items-center flex-wrap gap-2">
          <label class="px-2.5 sm:px-3 py-1.5 rounded-xl bg-surface-800 hover:bg-surface-700 text-gray-200 border border-surface-700/80 text-xs font-semibold flex items-center gap-1.5 cursor-pointer transition-all">
            <i data-lucide="image" class="w-3.5 h-3.5 text-blue-400"></i>
            <span id="pgImageBtnText">Attach Image</span>
            <input id="pgImageInput" type="file" accept="image/*" onchange="handlePlaygroundImage(event)" class="hidden" />
          </label>

          <label class="px-2.5 sm:px-3 py-1.5 rounded-xl bg-surface-800 hover:bg-surface-700 text-gray-200 border border-surface-700/80 text-xs font-semibold flex items-center gap-1.5 cursor-pointer transition-all">
            <i data-lucide="mic" class="w-3.5 h-3.5 text-emerald-400"></i>
            <span id="pgAudioBtnText">Voice / Audio (STT)</span>
            <input type="file" accept="audio/*" onchange="uploadAudioPlayground(event)" class="hidden" />
          </label>

          <label class="flex items-center gap-2 text-xs text-gray-400 cursor-pointer pl-1">
            <input id="pgStreaming" type="checkbox" checked class="w-3.5 h-3.5 rounded bg-surface-900 border-surface-700 text-brand-600 focus:ring-0" />
            <span>Streaming</span>
          </label>
        </div>

        <div class="flex items-center gap-2 w-full sm:w-auto">
          <button id="btnGenerateImage" onclick="generatePlaygroundImage()" class="flex-1 sm:flex-initial bg-purple-700 hover:bg-purple-600 text-white font-bold text-xs py-2 px-3 sm:px-4 rounded-xl flex items-center justify-center gap-1.5 transition-all shadow-md shadow-purple-700/20" title="Generate AI Image from prompt">
            <i data-lucide="palette" class="w-3.5 h-3.5"></i>
            <span>Image AI</span>
          </button>
          <button id="btnRunPlayground" onclick="runPlayground()" class="flex-1 sm:flex-initial bg-brand-600 hover:bg-brand-500 text-white font-bold text-xs py-2 px-5 sm:px-6 rounded-xl flex items-center justify-center gap-2 transition-all shadow-md shadow-brand-500/20">
            <i data-lucide="send" class="w-3.5 h-3.5"></i>
            <span data-i18n="playground.send_prompt">Kirim</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Response Output Box -->
    <div class="mt-4 pt-4 border-t border-surface-700/60 w-full min-w-0">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between text-xs text-gray-400 mb-2 gap-1.5">
        <div class="flex items-center gap-3">
          <span class="font-bold text-white flex items-center gap-1.5">
            <i data-lucide="bot" class="w-4 h-4 text-brand-400"></i>
            <span data-i18n="playground.response_title">Hasil Respon Realtime</span>
          </span>
          <button id="btnTtsPlay" onclick="speakPlaygroundResponse()" class="hidden px-2.5 py-1 rounded-lg bg-surface-700 hover:bg-surface-600 text-cyan-300 text-[11px] font-semibold flex items-center gap-1.5 transition-all">
            <i data-lucide="volume-2" class="w-3.5 h-3.5"></i>
            <span>Read Aloud (TTS)</span>
          </button>
        </div>
        <span id="pgMeta" class="text-[10px] sm:text-[11px] text-gray-400 font-mono"></span>
      </div>

      <div id="pgOutput" class="w-full min-h-[140px] max-h-[500px] overflow-y-auto p-4 rounded-xl bg-surface-900/90 border border-surface-700/60 text-xs text-gray-200 leading-relaxed font-mono markdown-body">
        <span class="text-gray-500">Hasil eksekusi model akan muncul di sini secara realtime streaming...</span>
      </div>
    </div>

  </div>
</div>
