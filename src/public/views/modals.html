<!-- MODAL: DETAILED LOG INSPECTOR -->
<div id="logDetailModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3 sm:p-4">
  <div class="glass-panel rounded-2xl max-w-3xl w-full max-h-[90vh] flex flex-col shadow-2xl border border-surface-700/80 overflow-hidden">
    <div class="p-4 border-b border-surface-700/60 flex items-center justify-between bg-surface-900/90">
      <div class="flex items-center gap-2">
        <i data-lucide="file-text" class="w-4 h-4 text-brand-400"></i>
        <h4 data-i18n="modals.log_title" class="text-xs sm:text-sm font-bold text-white">Detail Transaksi Permintaan</h4>
      </div>
      <button onclick="closeLogModal()" class="text-gray-400 hover:text-white p-1 rounded-lg">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>
    <div id="logModalContent" class="p-4 sm:p-6 overflow-y-auto space-y-4 text-xs font-mono text-gray-300">
      <!-- Populated dynamically by overview.js -->
    </div>
    <div class="p-3.5 border-t border-surface-700/60 bg-surface-900/90 flex justify-end gap-2">
      <button onclick="copyModalJson()" data-i18n="modals.copy_json" class="px-3.5 py-1.5 rounded-xl bg-surface-800 hover:bg-surface-700 text-xs text-white border border-surface-700 flex items-center gap-1.5">
        <i data-lucide="copy" class="w-3.5 h-3.5"></i> Salin JSON
      </button>
      <button onclick="closeLogModal()" data-i18n="modals.close" class="px-4 py-1.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-xs font-bold text-white">
        Tutup
      </button>
    </div>
  </div>
</div>

<!-- MODAL: INSTANT SDK CODE SNIPPET -->
<div id="codeSnippetModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3 sm:p-4">
  <div class="glass-panel rounded-2xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl border border-surface-700/80 overflow-hidden">
    <div class="p-4 border-b border-surface-700/60 flex items-center justify-between bg-surface-900/90">
      <div class="flex items-center gap-2">
        <i data-lucide="code" class="w-4 h-4 text-indigo-400"></i>
        <h4 data-i18n="modals.code_title" class="text-xs sm:text-sm font-bold text-white">Contoh Integrasi Kode</h4>
      </div>
      <button onclick="closeCodeModal()" class="text-gray-400 hover:text-white p-1 rounded-lg">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>
    <div class="p-4 sm:p-6 overflow-y-auto space-y-3">
      <div class="flex items-center gap-2 border-b border-surface-700/60 pb-2">
        <button id="btnSnippetCurl" onclick="showSnippetTab('curl')" class="px-3 py-1 text-xs rounded-lg bg-brand-600 text-white font-bold">cURL</button>
        <button id="btnSnippetPython" onclick="showSnippetTab('python')" class="px-3 py-1 text-xs rounded-lg text-gray-400 hover:text-white">Python</button>
        <button id="btnSnippetNode" onclick="showSnippetTab('node')" class="px-3 py-1 text-xs rounded-lg text-gray-400 hover:text-white">Node.js</button>
      </div>
      <pre id="codeSnippetContent" class="p-4 rounded-xl bg-surface-950 font-mono text-xs text-indigo-300 overflow-x-auto select-all max-w-full"></pre>
    </div>
    <div class="p-3.5 border-t border-surface-700/60 bg-surface-900/90 flex justify-end gap-2">
      <button onclick="copySnippetCode()" data-i18n="modals.copy_code" class="px-4 py-1.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-xs font-bold text-white flex items-center gap-1.5">
        <i data-lucide="copy" class="w-3.5 h-3.5"></i> Salin Kode
      </button>
    </div>
  </div>
</div>
