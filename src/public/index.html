<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Hub - Enterprise AI Gateway & Multi-Provider Router</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='16' height='16' x='4' y='4' rx='2'/><rect width='6' height='6' x='9' y='9' rx='1'/><path d='M15 2v2'/><path d='M15 20v2'/><path d='M2 15h2'/><path d='M2 9h2'/><path d='M20 15h2'/><path d='M20 9h2'/><path d='M9 2v2'/><path d='M9 20v2'/></svg>" />

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Tailwind Configuration -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              300: '#a5b4fc',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
              950: '#1e1b4b',
            },
            surface: {
              700: '#334155',
              800: '#1e293b',
              900: '#0f172a',
              950: '#070b14',
            }
          }
        }
      }
    }
  </script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-surface-950 text-gray-100 min-h-screen antialiased flex flex-col selection:bg-brand-500 selection:text-white">

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Top Navigation & Header -->
  <header class="sticky top-0 z-40 glass-panel border-b border-surface-700/60 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <!-- Logo & Status Indicator -->
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-brand-500/25">
            <i data-lucide="cpu" class="w-5 h-5"></i>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <span class="font-extrabold text-base tracking-tight bg-gradient-to-r from-white via-slate-100 to-slate-400 bg-clip-text text-transparent">AI HUB</span>
              <span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-brand-900/80 text-brand-300 border border-brand-700/60">Gateway</span>
            </div>
            <div class="flex items-center gap-1.5 text-[11px] text-emerald-400 font-medium">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 pulse-emerald"></span>
              <span>Online • Multi-Provider</span>
            </div>
          </div>
        </div>

        <!-- Desktop Navigation Tabs -->
        <nav class="hidden md:flex items-center gap-1.5 bg-surface-900/80 p-1.5 rounded-2xl border border-surface-700/60 shadow-inner">
          <button id="tab-overview" onclick="switchTab('overview')" class="tab-btn px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 tab-active">
            <i data-lucide="activity" class="w-3.5 h-3.5"></i>
            <span>Overview</span>
          </button>
          <button id="tab-agents" onclick="switchTab('agents')" class="tab-btn px-3.5 py-2 rounded-xl text-xs font-semibold transition-all flex items-center gap-2 text-gray-400 hover:text-white hover:bg-surface-700/60">
            <i data-lucide="bot" class="w-3.5 h-3.5 text-indigo-400"></i>
            <span>Agents & MCP</span>
          </button>
          <button id="tab-keys" onclick="switchTab('keys')" class="tab-btn px-3.5 py-2 rounded-xl text-xs font-semibold transition-all flex items-center gap-2 text-gray-400 hover:text-white hover:bg-surface-700/60">
            <i data-lucide="key" class="w-3.5 h-3.5"></i>
            <span>API Keys & Budgets</span>
          </button>
          <button id="tab-providers" onclick="switchTab('providers')" class="tab-btn px-3.5 py-2 rounded-xl text-xs font-semibold transition-all flex items-center gap-2 text-gray-400 hover:text-white hover:bg-surface-700/60">
            <i data-lucide="server" class="w-3.5 h-3.5"></i>
            <span>Providers & Routing</span>
          </button>
          <button id="tab-playground" onclick="switchTab('playground')" class="tab-btn px-3.5 py-2 rounded-xl text-xs font-semibold transition-all flex items-center gap-2 text-gray-400 hover:text-white hover:bg-surface-700/60">
            <i data-lucide="terminal" class="w-3.5 h-3.5"></i>
            <span>Playground & Studio</span>
          </button>
          <button id="tab-docs" onclick="switchTab('docs')" class="tab-btn px-3.5 py-2 rounded-xl text-xs font-semibold transition-all flex items-center gap-2 text-gray-400 hover:text-white hover:bg-surface-700/60">
            <i data-lucide="book-open" class="w-3.5 h-3.5"></i>
            <span>Docs</span>
          </button>
        </nav>

        <!-- Right Quick Controls: Master Token & Refresh -->
        <div class="flex items-center gap-2.5">
          <div class="hidden lg:flex items-center gap-1.5 bg-surface-900/90 border border-surface-700/70 rounded-xl px-2.5 py-1">
            <i data-lucide="shield-check" class="w-3.5 h-3.5 text-brand-400"></i>
            <input id="adminTokenInput" type="password" placeholder="Master Admin Token"
              class="bg-transparent text-xs text-white focus:outline-none w-36 font-mono" />
            <button onclick="saveAdminToken()" class="text-[10px] font-bold bg-brand-600 hover:bg-brand-500 text-white px-2 py-0.5 rounded-lg transition-colors" title="Save Token">
              Save
            </button>
          </div>

          <button onclick="refreshAll()" class="p-2 rounded-xl bg-surface-800 hover:bg-surface-700 text-gray-300 hover:text-white border border-surface-700/60 transition-all shadow-sm" title="Refresh Dashboard">
            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          </button>

          <!-- Mobile Hamburger Toggle -->
          <button onclick="toggleMobileMenu()" class="md:hidden p-2 rounded-xl bg-surface-800 hover:bg-surface-700 text-gray-300 border border-surface-700/60">
            <i data-lucide="menu" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Mobile Drawer Navigation -->
    <div id="mobileMenu" class="md:hidden hidden border-t border-surface-700/60 bg-surface-900/95 px-4 pt-3 pb-4 space-y-2">
      <button id="mobile-tab-overview" onclick="switchTab('overview')" class="w-full px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-2 text-left tab-active">
        <i data-lucide="activity" class="w-4 h-4"></i> Overview
      </button>
      <button id="mobile-tab-agents" onclick="switchTab('agents')" class="w-full px-3 py-2 rounded-lg text-xs font-semibold flex items-center gap-2 text-left text-gray-300 hover:bg-surface-800">
        <i data-lucide="bot" class="w-4 h-4 text-indigo-400"></i> Agents & MCP Hub
      </button>
      <button id="mobile-tab-keys" onclick="switchTab('keys')" class="w-full px-3 py-2 rounded-lg text-xs font-semibold flex items-center gap-2 text-left text-gray-300 hover:bg-surface-800">
        <i data-lucide="key" class="w-4 h-4"></i> API Keys & Budgets
      </button>
      <button id="mobile-tab-providers" onclick="switchTab('providers')" class="w-full px-3 py-2 rounded-lg text-xs font-semibold flex items-center gap-2 text-left text-gray-300 hover:bg-surface-800">
        <i data-lucide="server" class="w-4 h-4"></i> Providers & Routing
      </button>
      <button id="mobile-tab-playground" onclick="switchTab('playground')" class="w-full px-3 py-2 rounded-lg text-xs font-semibold flex items-center gap-2 text-left text-gray-300 hover:bg-surface-800">
        <i data-lucide="terminal" class="w-4 h-4"></i> Playground & Studio
      </button>
      <button id="mobile-tab-docs" onclick="switchTab('docs')" class="w-full px-3 py-2 rounded-lg text-xs font-semibold flex items-center gap-2 text-left text-gray-300 hover:bg-surface-800">
        <i data-lucide="book-open" class="w-4 h-4"></i> Documentation
      </button>

      <div class="pt-2 border-t border-surface-700/60">
        <label class="block text-[11px] text-gray-400 mb-1">Master Token:</label>
        <div class="flex items-center gap-2">
          <input id="adminTokenInputMobile" type="password" onchange="document.getElementById('adminTokenInput').value=this.value; saveAdminToken();"
            class="w-full glass-input px-3 py-1.5 rounded-lg text-xs text-white font-mono" placeholder="Master Admin Token" />
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Container with Modular Partial Views -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8 flex-1">
    <!--#include file="views/overview.html" -->
    <!--#include file="views/agents.html" -->
    <!--#include file="views/keys.html" -->
    <!--#include file="views/providers.html" -->
    <!--#include file="views/playground.html" -->
    <!--#include file="views/docs.html" -->
  </main>

  <!-- Modals Layer -->
  <!--#include file="views/modals.html" -->

  <!-- Modular Scripts Architecture -->
  <script src="/js/api.js"></script>
  <script src="/js/overview.js"></script>
  <script src="/js/logs.js"></script>
  <script src="/js/keys.js"></script>
  <script src="/js/providers.js"></script>
  <script src="/js/playground.js"></script>
  <script src="/js/agents.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
